# Playback level for the bounded speaker bring-up driver (6 dB below native).
# This file requires the level6 codec module; the original HiFi.conf stays
# available for the frozen kernel66 module set with its lower control ceiling.
SectionVerb {
    EnableSequence [
        cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 1"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
    ]
    DisableSequence [
        cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 0"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
    ]
    Value { TQ "HiFi" }
}
SectionDevice."Speaker" {
    Comment "Speakers"
    EnableSequence [
        cset "name='Amp0 Playback Volume' 487"
        cset "name='Amp1 Playback Volume' 487"
        cset "name='Amp2 Playback Volume' 487"
        cset "name='Amp3 Playback Volume' 487"
        cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
    }
}

Include.mic.File "Mic75.conf"
