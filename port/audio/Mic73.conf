# Candidate for the verified native ADC map73. Not included by the live UCM.
# Only configure these routes; PCM capture still requires separate validation.
SectionDevice."Mic" {
    Comment "Internal Microphones"
    EnableSequence [
        cset "name='TX0 MODE' ADC_LP"
        cset "name='TX2 MODE' ADC_LP"
        cset "name='ADC1 MUX' CH1_AMIC1"
        cset "name='ADC3 MUX' CH3_AMIC4"
        cset "name='ADC1 Volume' 12"
        cset "name='ADC3 Volume' 12"
        cset "name='TX_DEC2 Volume' 84"
        cset "name='TX_DEC5 Volume' 84"
        cset "name='TX DEC2 MUX' SWR_MIC"
        cset "name='TX DEC5 MUX' SWR_MIC"
        cset "name='TX SMIC MUX2' SWR_MIC4"
        cset "name='TX SMIC MUX5' SWR_MIC8"
        cset "name='ADC1 Switch' 1"
        cset "name='ADC3 Switch' 1"
        cset "name='ADC1_MIXER Switch' 1"
        cset "name='ADC3_MIXER Switch' 1"
        cset "name='TX_AIF1_CAP Mixer DEC2' 1"
        cset "name='TX_AIF1_CAP Mixer DEC5' 1"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
    ]
    DisableSequence [
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
        cset "name='TX_AIF1_CAP Mixer DEC5' 0"
        cset "name='TX_AIF1_CAP Mixer DEC2' 0"
        cset "name='ADC3_MIXER Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC1 Switch' 0"
        cset "name='TX SMIC MUX5' ZERO"
        cset "name='TX SMIC MUX2' ZERO"
        cset "name='TX DEC5 MUX' MSM_DMIC"
        cset "name='TX DEC2 MUX' MSM_DMIC"
        cset "name='TX2 MODE' ADC_INVALID"
        cset "name='TX0 MODE' ADC_INVALID"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
        CaptureRate 48000
    }
}
