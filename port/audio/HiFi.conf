# Route the DPCM backend before the desktop probes PCM capabilities.
# The codec still stays reset until a stream actually starts.
SectionVerb {
    EnableSequence [
        cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 1"
    ]
    DisableSequence [
        cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 0"
    ]
    Value { TQ "HiFi" }
}
SectionDevice."Speaker" {
    Comment "Speakers"
    EnableSequence [
        cset "name='Amp0 Playback Volume' 319"
        cset "name='Amp1 Playback Volume' 319"
        cset "name='Amp2 Playback Volume' 319"
        cset "name='Amp3 Playback Volume' 319"
        cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
    }
}
